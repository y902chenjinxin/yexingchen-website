# 鐜勯粍涓汉宸ヤ綔鍙?路 Nginx 鍙嶅悜浠ｇ悊閰嶇疆锛坹exingchen.cn锛?#
# 璇存槑锛?# - 鏈枃浠朵负杩愮淮鍙傝€冮厤缃紝瀹為檯浠ユ湇鍔″櫒 /etc/nginx/conf.d/yexingchen.cn.conf 涓哄噯銆?# - 鍏抽敭 location 瑙勫垯锛堝巻鍙茶俯鍧戯紝鍕垮洖閫€锛夛細
#   * /assets/  -> try_files $uri /index.html锛涘惁鍒?Vite 鏋勫缓 chunk 浼?403銆?#   * = /health -> 蹇呴』绮剧‘鍖归厤骞朵唬鐞嗗埌鍚庣锛屽惁鍒欎細琚?SPA fallback 鎷︽埅杩斿洖 HTML銆?#   * /api/     -> 浠ｇ悊鍒?FastAPI(8000)銆?#   * 鍏朵綑      -> try_files $uri $uri/ /index.html锛圫PA fallback锛夈€?# - HTTPS 璇佷功璺緞璇锋寜鏈嶅姟鍣ㄥ疄闄呴儴缃插～鍐欎笅鏂瑰崰浣嶃€?
server {
    listen 80;
    server_name yexingchen.cn www.yexingchen.cn;

    # HTTP 缁熶竴璺宠浆 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name yexingchen.cn www.yexingchen.cn;

    # 璇佷功璺緞鍗犱綅锛堟寜鏈嶅姟鍣ㄥ疄闄呰矾寰勬浛鎹級
    ssl_certificate     /etc/nginx/ssl/yexingchen.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/yexingchen.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 鍓嶇闈欐€佽祫婧?    root /var/www/yexingchen/dist;

    # ========== 瀹夊叏鍝嶅簲澶?==========
    # HSTS: 寮哄埗 HTTPS 涓ゅ勾锛堝惈瀛愬煙锛?    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # 闃?clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 闃?MIME 绫诲瀷鍡呮帰
    add_header X-Content-Type-Options "nosniff" always;
    # Referrer 绛栫暐
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 鏉冮檺绛栫暐
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: 鍏佽 self + inline style/eval锛圴ite + Element Plus 闇€瑕侊級
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'" always;
    # 璺ㄥ煙 opener锛堥槻姝?window.opener 鏀诲嚮锛?    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # 璺ㄥ煙璧勬簮锛圕DN 瀛椾綋/鍥剧墖闇€瑕侊級
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    # ====================================

    index index.html;

    # 鍚庣鍋ュ悍妫€鏌ワ細绮剧‘鍖归厤锛岄伩鍏嶈 SPA fallback 鍚炴帀
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Vite 鏋勫缓浜х墿
    location /assets/ {
        try_files $uri /index.html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 鍚庣 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback锛堟墍鏈夋湭鍖归厤璺緞鍥炶惤鍒?index.html锛?    location / {
        try_files $uri $uri/ /index.html;
    }
}
