# 玄黄个人工作台 · Nginx 反向代理配置（yexingchen.cn）
#
# 说明：
# - 本文件为运维参考配置，实际以服务器 /etc/nginx/conf.d/yexingchen.cn.conf 为准。
# - 关键 location 规则（历史踩坑，勿回退）：
#   * /assets/  -> try_files $uri /index.html；否则 Vite 构建 chunk 会 403。
#   * = /health -> 必须精确匹配并代理到后端，否则会被 SPA fallback 拦截返回 HTML。
#   * /api/     -> 代理到 FastAPI(8000)。
#   * 其余      -> try_files $uri $uri/ /index.html（SPA fallback）。
# - HTTPS 证书路径请按服务器实际部署填写下方占位。

server {
    listen 80;
    server_name yexingchen.cn www.yexingchen.cn;

    # HTTP 统一跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name yexingchen.cn www.yexingchen.cn;

    # 证书路径占位（按服务器实际路径替换）
    ssl_certificate     /etc/nginx/ssl/yexingchen.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/yexingchen.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 前端静态资源
    root /var/www/yexingchen/dist;
    index index.html;

    # 后端健康检查：精确匹配，避免被 SPA fallback 吞掉
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 10s;
    }

    # Vite 构建产物
    location /assets/ {
        try_files $uri /index.html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback（所有未匹配路径回落到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}