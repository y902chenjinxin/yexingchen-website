# 玄黄 · 生产 nginx 配置（yexingchen.cn）
#
# ⚠️ 本文件与服务器 /etc/nginx/conf.d/yexingchen.cn.conf **保持一致**，
#    由 scripts/_nginx_conf.py 下发（改完先 nginx -t 再 reload，失败自动回滚）。
#
# 关键约定（都是踩过的坑，别回退）：
#   * /assets/ 缺文件必须回 404，**绝不能** try_files 到 /index.html
#   * = /index.html 与 = /sw.js 必须 no-cache，否则旧壳残影
#   * = /health 必须精确匹配并代理到后端，否则会被 SPA fallback 吞掉
#   * /api/ 代理到 FastAPI(8000)；/api/tool/idphoto/ 优先代理到 8080
#
server {
    listen       80;
    listen       [::]:80;
    server_name  yexingchen.cn;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2 on;
    server_name  yexingchen.cn;

    ssl_certificate     /etc/nginx/ssl/yexingchen.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/yexingchen.cn.key;
    ssl_session_timeout 5m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    root /var/www/yexingchen/dist;
    index index.html index.htm;

    # ===== 跨域隔离（证件照 AI 抠图 MODNet 线程化 wasm 依赖 SharedArrayBuffer）=====
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # ===== 入口壳与 SW 脚本：每次回源校验，杜绝「旧壳残影」 =====
    # 用 `expires -1`（→ Cache-Control: no-cache）而不是 add_header：
    # add_header 只要在 location 里出现，就会**覆盖**从 server 继承的 add_header
    # （上面那条 COOP 会随之丢失）；expires 是独立指令，不受此规则影响。
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    # ===== Vite 内容哈希产物 =====
    # ⚠️ 缺失必须回 404，**绝不能** try_files 到 /index.html：
    # 部署后老壳引用的旧 chunk 已从磁盘删除，若被 SPA fallback 顶成 index.html
    # （HTTP 200 + Content-Type: text/html），浏览器 / Service Worker 会把它
    # 当 JS / CSS 缓存下来 —— 症状是「样式全丢、图标巨大」，且刷新也不恢复。
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # ES Module（.mjs）返回 JS MIME，否则浏览器动态 import 拒绝加载；
    # .onnx 按二进制下载
    location ~* \.(mjs|onnx|wasm)$ {
        types {
            application/javascript  mjs;
            application/onnx        onnx;
            application/wasm        wasm;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /test/ {
        alias /var/www/yexingchen/test/;
        try_files $uri $uri/ /test/index.html;
    }

    location /test/assets/ {
        alias /var/www/yexingchen/dist/assets/;
    }

    # 证件照（HivisionIDPhotos）反向代理，优先级高于 /api/ 前缀
    location ^~ /api/tool/idphoto/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 500M;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 500M;
    }

    # RSS 公开订阅（F9）：无需鉴权，代理到 fastapi
    location /rss/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }


    location /uploads/ {
        alias /var/www/yexingchen/backend/uploads/;
        expires 30d;
        add_header Access-Control-Allow-Origin *;
    }

    location /music/ {
        alias /var/www/yexingchen/backend/uploads/music/;
        expires 30d;
        add_header Access-Control-Allow-Origin *;
    }

}
