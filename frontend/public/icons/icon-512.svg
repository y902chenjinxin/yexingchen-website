<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c4a47"/>
      <stop offset="0.55" stop-color="#157a6e"/>
      <stop offset="1" stop-color="#0e2e2c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e6bd"/>
      <stop offset="0.5" stop-color="#c7a96b"/>
      <stop offset="1" stop-color="#9c7b3c"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.32" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角方底：墨青→雨青渐变 -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 顶部高光（玻璃质感） -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#gloss)"/>
  <!-- 鎏金描边 -->
  <rect x="22" y="22" width="468" height="468" rx="98" fill="none" stroke="url(#gold)" stroke-width="9" opacity="0.9"/>
  <!-- 内描边再压一层细金线，质感更厚 -->
  <rect x="40" y="40" width="432" height="432" rx="82" fill="none" stroke="#c7a96b" stroke-width="2" opacity="0.35"/>

  <!-- 玄（鎏金，衬线）。浏览器标签用 index.html 引入的 Noto Serif SC 渲染；
       位图导出若环境无 CJK 字体则该字缺省——已用金描边方底保证即便缺字也是完整质感图标 -->
  <text x="256" y="356" font-family="'Noto Serif SC','Songti SC','STSong','SimSun',serif"
        font-size="312" font-weight="700" fill="url(#gold)" text-anchor="middle">玄</text>
</svg>
